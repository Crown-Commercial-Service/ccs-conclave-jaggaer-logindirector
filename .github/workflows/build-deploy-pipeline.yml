name: Login Director - Build and Run Tests

on:
  push:
    branches: [develop, staging, main]
    paths-ignore:
      - "**/*.md"
      - "**/*.gitignore"
      - "**/*.gitattributes"
  pull_request:
    types: [opened, synchronize]
    branches: [develop, staging, main]
    paths-ignore:
      - "**/*.md"
      - "**/*.gitignore"
      - "**/*.gitattributes"

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: true

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build Web App
        run: dotnet build logindirector --configuration Release

      - name: Run Unit Tests
        run: dotnet test LoginDirectorTests --configuration Release